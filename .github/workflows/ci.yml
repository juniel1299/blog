name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify Tistory skin output
        run: |
          for f in skin.html index.xml style.css images/script.js; do
            test -s "skin/dist/tistory/$f" || { echo "missing $f"; exit 1; }
          done
          cmp skin/tistory/skin.html skin/dist/tistory/skin.html
      - name: Worker bundle (dry run)
        run: npm run verify -w worker
      - name: D1 migrations + doc links seed apply locally
        run: |
          npm run db:migrate:local -w worker
          npm run db:seed:local -w worker

  # Deploys the Worker after every merge to main, once `check` has passed.
  # Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see README, 자동 배포).
  # The Tistory skin is not deployed here: Tistory has no upload API, so skin changes stay manual.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BLOG }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FLARE }}
      WORKER_URL: https://tistory-ai-assistant-api.youngs5440.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check deploy secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] \
            || { echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets"; exit 1; }
      - name: Apply D1 migrations
        run: npm run db:migrate:remote -w worker
      - name: Upsert doc links seed
        run: npm run db:seed:remote -w worker
      - name: Deploy Worker
        run: npm run deploy -w worker
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$WORKER_URL/health/ready") && [ "$code" = 200 ] && exit 0
            sleep 10
          done
          echo "::error::$WORKER_URL/health/ready did not return 200 (last: $code)"; exit 1
